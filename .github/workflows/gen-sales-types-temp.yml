name: Temp regenerate Supabase sales types

on:
  push:
    branches:
      - feat/m1-sales-deep-flow
    paths:
      - .github/workflows/gen-sales-types-temp.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m1-sales-deep-flow
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start local Supabase
        run: supabase start
      - name: Regenerate exact database types
        run: supabase gen types typescript --local > apps/web/src/lib/supabase/database.types.ts
      - name: Commit generated contract if changed
        run: |
          if git diff --quiet -- apps/web/src/lib/supabase/database.types.ts; then
            echo "No generated type changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/supabase/database.types.ts
          git commit -m "chore: regenerate Supabase types for sales"
          git push origin HEAD:feat/m1-sales-deep-flow
