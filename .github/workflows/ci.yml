name: Verdis CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verdis-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Export generated pnpm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error

      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Database tests
        run: supabase test db

      - name: Generate TypeScript database contract
        if: success()
        run: |
          mkdir -p generated
          supabase gen types typescript --local > generated/database.types.ts

      - name: Export generated database contract
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: generated/database.types.ts
          if-no-files-found: error

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
