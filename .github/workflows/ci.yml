name: Verdis CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: verdis-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Export generated pnpm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error

      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start local Supabase
        run: supabase start

      - name: Database tests
        run: supabase test db

      - name: Generate TypeScript database contract
        if: success()
        run: |
          mkdir -p generated
          supabase gen types typescript --local > generated/database.types.ts

      - name: Export generated database contract
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: generated/database.types.ts
          if-no-files-found: error

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  freeze-generated:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [web, database]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Download pnpm lockfile
        uses: actions/download-artifact@v4
        with:
          name: pnpm-lock
          path: .generated/pnpm

      - name: Download database types
        uses: actions/download-artifact@v4
        with:
          name: database-types
          path: .generated/database

      - name: Install generated contracts
        run: |
          cp .generated/pnpm/pnpm-lock.yaml pnpm-lock.yaml
          mkdir -p apps/web/src/lib/supabase
          cp .generated/database/database.types.ts apps/web/src/lib/supabase/database.types.ts
          rm -rf .generated

      - name: Commit generated contracts when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/web/src/lib/supabase/database.types.ts
          if git diff --cached --quiet; then
            echo "Generated contracts are already current."
          else
            git commit -m "chore: freeze generated contracts [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
