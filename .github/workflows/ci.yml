name: Verdis CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verdis-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        id: web_tests
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee /tmp/verdis-web-tests.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload web test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-diagnostics
          path: /tmp/verdis-web-tests.log

      - name: Enforce unit test result
        if: steps.web_tests.outputs.status != '0'
        run: exit 1

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start local Supabase
        run: supabase start

      - name: Database tests
        id: db_tests
        shell: bash
        run: |
          set +e
          supabase test db 2>&1 | tee /tmp/verdis-db-tests.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload database test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-test-diagnostics
          path: /tmp/verdis-db-tests.log

      - name: Enforce database test result
        if: steps.db_tests.outputs.status != '0'
        run: exit 1

      - name: Verify generated TypeScript database contract
        run: |
          mkdir -p generated
          supabase gen types typescript --local > generated/database.types.ts
          diff -u apps/web/src/lib/supabase/database.types.ts generated/database.types.ts

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
