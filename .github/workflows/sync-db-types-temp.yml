name: Temporary DB Types Sync

on:
  push:
    branches:
      - feat/m1-cooperative-shell-overviews

permissions:
  contents: write

jobs:
  sync-types:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(types):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m1-cooperative-shell-overviews

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start local Supabase
        run: supabase start

      - name: Regenerate database types
        run: supabase gen types typescript --local > apps/web/src/lib/supabase/database.types.ts

      - name: Commit generated contract
        run: |
          if git diff --quiet -- apps/web/src/lib/supabase/database.types.ts; then
            echo "Database types already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/supabase/database.types.ts
          git commit -m "chore(types): sync Supabase database contract"
          git push origin HEAD:feat/m1-cooperative-shell-overviews

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
